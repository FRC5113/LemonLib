[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lemonlib"
dynamic = ["version"]
description = "The goal of LemonLib is to allow all teams of any skill level to have an easier time in FRC"
requires-python = ">=3.11"
dependencies = [
    "robotpy==2027.0.0a7",
    "photonlibpy @ git+https://github.com/PhotonVision/photonvision.git@main#subdirectory=photon-lib/py",
    "phoenix6==26.70.0a2",
    "robotpy-commands-v2==2027.0.0a7",
]
authors = [{ name = "Combustible Lemons", email = "robotics@mtps.us" }]
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/FRC5113/LemonLib"

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.version]
path = "lemonlib/__init__.py"

[tool.hatch.metadata]
# Needed for the photonlibpy git dependency
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["lemonlib"]

[tool.hatch.build.targets.sdist]
include = ["lemonlib", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
